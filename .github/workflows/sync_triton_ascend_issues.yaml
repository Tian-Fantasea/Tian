#
# Sync triton-ascend issues to Google Sheets tracking table.
#
# Runs daily at 10:00 AM Beijing time (02:00 UTC) and can be triggered manually.
#

name: "Sync triton-ascend Issues to Google Sheets"

on:
  schedule:
    - cron: '0 2 * * *'  # 10:00 AM Beijing time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write   # for committing metadata file changes

concurrency:
  group: sync-triton-ascend-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread requests

      - name: Sync issues to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METADATA_FILE_PATH: ${{ github.workspace }}/scripts/triton_ascend_issue_metadata.json
        run: python3 scripts/sync_triton_ascend_issues.py

      - name: Commit metadata changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/triton_ascend_issue_metadata.json
          if git diff --staged --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "chore: update triton-ascend issue sync metadata [skip ci]"
            git push
          fi
