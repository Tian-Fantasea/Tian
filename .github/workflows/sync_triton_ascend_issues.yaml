#
# Sync triton-ascend issues to Google Sheets via Apps Script Web App.
#
# Runs 3 times daily: 10:00, 15:00, 20:00 Beijing time (UTC+8).
#

name: "Sync triton-ascend Issues to Google Sheets"

on:
  schedule:
    - cron: '0 2 * * *'   # 10:00 AM Beijing
    - cron: '0 7 * * *'   # 15:00 Beijing
    - cron: '0 12 * * *'  # 20:00 Beijing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-triton-ascend-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Sync issues to Google Sheets
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_triton_ascend_issues.py
